<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-dark:#F1E8D3;
    --pine:#2F4B3C;
    --pine-dark:#1E3128;
    --mustard:#D9A441;
    --tomato:#C1442E;
    --ink:#26241F;
    --ink-soft:#6B6555;
    --line:#DCD0B0;
    --chalk:#FFFDF7;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .logo{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:600;
    font-size:2rem;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--pine-dark);
  }
  .logo span{color:var(--tomato);}

  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
  }

  .add-category-btn{
    background:none;
    color:var(--pine);
    border:1.5px solid var(--pine);
    border-radius:999px;
    padding:8px 16px;
    font-size:0.85rem;
    font-weight:600;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .add-category-btn:hover{background:var(--pine);color:var(--chalk);}

  /* ---------- Add item form ---------- */
  .add-item-form{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .add-item-form input[type="text"]{
    flex:1 1 200px;
    min-width:0;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    background:var(--chalk);
    font-size:16px;
    color:var(--ink);
  }
  .add-item-form select{
    padding:12px 10px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    background:var(--chalk);
    font-size:16px;
    color:var(--ink);
    max-width:150px;
    min-width:0;
  }
  .add-item-form input:focus,
  .add-item-form select:focus,
  .new-category-form input:focus{
    outline:2px solid var(--mustard);
    outline-offset:1px;
  }
  .add-item-form button{
    background:var(--tomato);
    color:var(--chalk);
    border-radius:var(--radius);
    padding:12px 20px;
    font-weight:600;
    font-size:0.95rem;
  }
  .add-item-form button:hover{background:#a83a26;}

  .add-status{
    min-height:1.1em;
    margin:-6px 0 16px;
    font-size:0.85rem;
    color:var(--ink-soft);
    opacity:0;
    transform:translateY(-2px);
    transition:opacity .18s ease, transform .18s ease;
  }
  .add-status.visible{
    opacity:1;
    transform:translateY(0);
  }
  .add-status.duplicate{color:var(--tomato);}
  .add-status.moved{color:var(--pine);}

  /* ---------- New category form ---------- */
  .new-category-form{
    display:flex;
    gap:8px;
    margin:-4px 0 18px;
    flex-wrap:wrap;
  }
  .new-category-form.hidden{display:none;}
  .new-category-form input{
    flex:1 1 180px;
    min-width:0;
    padding:10px 12px;
    border:1.5px dashed var(--pine);
    border-radius:var(--radius);
    background:var(--chalk);
    font-size:16px;
  }
  .new-category-form .confirm{
    background:var(--pine);
    color:var(--chalk);
    border-radius:var(--radius);
    padding:10px 16px;
    font-weight:600;
    font-size:0.85rem;
  }
  .new-category-form .cancel{
    background:none;
    color:var(--ink-soft);
    padding:10px 10px;
    font-size:0.85rem;
    text-decoration:underline;
  }

  /* ---------- Category sections ---------- */
  .categories{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .category{
    background:var(--paper-dark);
    border-radius:var(--radius);
    padding:16px 16px 8px;
  }
  .aisle-sign{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--pine);
    color:var(--chalk);
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:7px 16px 7px 26px;
    border-radius:6px;
    position:relative;
  }
  .aisle-sign .grommet{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    width:6px;
    height:6px;
    background:var(--paper-dark);
    border-radius:50%;
  }
  .aisle-sign .delete-cat{
    background:none;
    border:none;
    color:var(--chalk);
    opacity:0.55;
    font-size:0.9rem;
    line-height:1;
    padding:0 0 0 6px;
  }
  .aisle-sign .delete-cat:hover{opacity:1;}
  .aisle-sign .delete-cat.armed{
    opacity:1;
    color:var(--mustard);
    font-weight:600;
  }

  .item-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 2px;
    border-bottom:1px solid var(--line);
  }
  .item.flash{
    animation:itemFlash 1s ease;
  }
  @keyframes itemFlash{
    0%{ background:var(--mustard); }
    100%{ background:transparent; }
  }
  .item:last-child{border-bottom:none;}
  .item label{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    flex:1;
    min-width:0;
    font-size:0.98rem;
  }
  .item label span{
    overflow-wrap:anywhere;
  }
  .item input[type="checkbox"]{
    appearance:none;
    width:19px;
    height:19px;
    border:2px solid var(--pine);
    border-radius:5px;
    flex-shrink:0;
    display:grid;
    place-content:center;
    cursor:pointer;
  }
  .item input[type="checkbox"]::before{
    content:"";
    width:10px;
    height:10px;
    border-radius:2px;
    transform:scale(0);
    transition:transform .12s ease;
    background:var(--pine);
  }
  .item input[type="checkbox"]:checked::before{transform:scale(1);}
  .item-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .item .edit-btn{
    background:none;
    color:var(--ink-soft);
    opacity:0.55;
    font-size:0.95rem;
    padding:2px 6px;
    line-height:1;
  }
  .item .edit-btn:hover{opacity:1;color:var(--pine);}
  .item .remove{
    background:none;
    color:var(--ink-soft);
    opacity:0.5;
    font-size:1rem;
    padding:2px 6px;
    white-space:nowrap;
  }
  .item .remove:hover{opacity:1;color:var(--tomato);}
  .item .remove.armed{
    opacity:1;
    color:var(--chalk);
    background:var(--tomato);
    border-radius:999px;
    font-size:0.78rem;
    font-weight:600;
    padding:4px 10px;
  }

  .item.editing{
    display:block;
    padding:9px 2px;
  }
  .edit-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    width:100%;
  }
  .edit-row .edit-name{
    flex:1 1 140px;
    min-width:0;
    padding:8px 10px;
    border:1.5px solid var(--pine);
    border-radius:6px;
    background:var(--chalk);
    font-size:16px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .edit-row .edit-category{
    flex:0 1 140px;
    min-width:0;
    padding:8px 8px;
    border:1.5px solid var(--pine);
    border-radius:6px;
    background:var(--chalk);
    font-size:16px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .edit-row .edit-save{
    background:var(--pine);
    color:var(--chalk);
    border-radius:6px;
    padding:8px 14px;
    font-size:0.85rem;
    font-weight:600;
  }
  .edit-row .edit-save:hover{background:var(--pine-dark);}
  .edit-row .edit-cancel{
    background:none;
    color:var(--ink-soft);
    font-size:0.85rem;
    padding:8px 6px;
    text-decoration:underline;
  }
  .edit-row .edit-cancel:hover{color:var(--tomato);}

  .empty-note{
    color:var(--ink-soft);
    font-size:0.85rem;
    font-style:italic;
    margin:0 0 12px 2px;
  }

  /* ---------- Receipt / history strip ---------- */
  .category-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
  }
  .history-toggle{
    background:none;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.03em;
    white-space:nowrap;
    padding:5px 2px;
    flex-shrink:0;
  }
  .history-toggle:hover{color:var(--pine);}
  .history-toggle.open{color:var(--pine);font-weight:600;}

  .category-history{
    background:var(--chalk);
    border-radius:8px;
    padding:12px 14px 14px;
    margin-bottom:12px;
    position:relative;
  }
  .category-history::before{
    content:"";
    position:absolute;
    top:0;left:14px;right:14px;
    border-top:2px dashed var(--line);
  }
  .category-history-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:6px 0 10px;
  }
  .history-clear{
    background:none;
    color:var(--ink-soft);
    text-decoration:underline;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
  }
  .history-clear:hover{color:var(--tomato);}
  .history-clear.armed{
    color:var(--tomato);
    font-weight:600;
    text-decoration:none;
  }
  .history-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .history-chip{
    display:flex;
    align-items:center;
    gap:2px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px 4px 2px 12px;
    transition:background .12s ease, border-color .12s ease;
  }
  .history-chip:hover{background:var(--mustard);border-color:var(--mustard);}
  .history-chip:hover .history-title{color:var(--pine-dark);}
  .history-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    background:none;
    color:var(--ink);
    padding:4px 4px;
  }
  .history-remove{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.9rem;
    background:none;
    color:var(--ink-soft);
    opacity:0.5;
    padding:4px 8px;
    line-height:1;
  }
  .history-remove:hover{opacity:1;color:var(--tomato);}

  @media (max-width:420px){
    .logo{font-size:1.6rem;}
    .add-item-form select{max-width:120px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1 class="logo">Market <span>List</span></h1>
    <button class="add-category-btn" id="toggleCategoryForm">+ New aisle</button>
  </header>

  <div class="add-item-form" id="addItemForm">
    <input type="text" id="itemInput" placeholder="Add an item…" autocomplete="off">
    <select id="categorySelect"></select>
    <button type="button" id="addItemBtn">Add</button>
  </div>
  <p class="add-status" id="addStatus" aria-live="polite"></p>

  <div class="new-category-form hidden" id="newCategoryForm">
    <input type="text" id="newCategoryInput" placeholder="Aisle name, e.g. Snacks">
    <button type="button" class="confirm" id="confirmNewCategory">Add aisle</button>
    <button type="button" class="cancel" id="cancelNewCategory">Cancel</button>
  </div>

  <main class="categories" id="categoriesContainer"></main>

</div>

<script>
(function(){
  const STORAGE_KEY = 'marketListData';

  const DEFAULT_CATEGORIES = [
    'Produce','Dairy & Eggs','Meat & Seafood','Bakery',
    'Pantry','Frozen','Beverages','Household','Other'
  ];

  function toSentenceCase(str){
    str = str.trim().replace(/\s+/g, ' ');
    if(!str) return str;
    return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
  }

  // A handful of common grocery words ending in "-ie" whose plural just adds
  // "s" (cookie -> cookies), which the generic "-ies -> -y" rule below would
  // otherwise mangle (cookies -> "cooky"). Keyed by the lowercase plural.
  const IE_PLURAL_EXCEPTIONS = {
    cookies:'cookie', veggies:'veggie', smoothies:'smoothie',
    brownies:'brownie', pies:'pie', movies:'movie'
  };

  // Words that look plural but are either mass nouns or are effectively
  // always shopped-for in "plural" form — singularizing these would be wrong
  // or just weird ("fries" -> "fry").
  const NEVER_SINGULARIZE = new Set([
    'molasses', 'fries', 'greens', 'oats', 'grits',
    'asparagus', 'hummus', 'citrus'
  ]);

  function singularizeWord(word){
    const lower = word.toLowerCase();

    if(NEVER_SINGULARIZE.has(lower)) return word;

    if(IE_PLURAL_EXCEPTIONS[lower]){
      const singular = IE_PLURAL_EXCEPTIONS[lower];
      const firstIsUpper = word.charAt(0) === word.charAt(0).toUpperCase();
      return firstIsUpper ? singular.charAt(0).toUpperCase() + singular.slice(1) : singular;
    }

    if(word.length <= 3) return word;

    if(lower.endsWith('ies')) return word.slice(0, -3) + 'y';        // berries -> berry
    if(lower.endsWith('oes')) return word.slice(0, -2);              // tomatoes -> tomato

    if(lower.endsWith('es')){
      const stem = lower.slice(0, -2);
      if(/[sxz]$/.test(stem) || stem.endsWith('ch') || stem.endsWith('sh')){
        return word.slice(0, -2);                                    // dishes -> dish, boxes -> box
      }
    }

    if(lower.endsWith('s') && !lower.endsWith('ss') && !lower.endsWith('us') && !lower.endsWith('is')){
      return word.slice(0, -1);                                      // onions -> onion
    }

    return word;
  }

  function normalizeItemName(raw){
    // Storage/display keeps whatever grammatical number the person typed —
    // only casing gets normalized here.
    return toSentenceCase(raw);
  }

  function itemMatchKey(name){
    // Used only for duplicate comparisons, never for storage/display, so
    // "radish" and "radishes" are recognized as the same item without
    // forcing either spelling on what's actually saved.
    const lower = name.trim().toLowerCase();
    if(!lower) return lower;
    const words = lower.split(' ');
    words[words.length - 1] = singularizeWord(words[words.length - 1]);
    return words.join(' ');
  }

  function normalizeState(state){
    const seenActive = new Set();
    state.items = state.items
      .map(it => ({ ...it, name: normalizeItemName(it.name) }))
      .filter(it => {
        const key = itemMatchKey(it.name);
        if(seenActive.has(key)) return false;
        seenActive.add(key);
        return true;
      });

    const seenHistory = new Set();
    const dedupedHistory = [];
    state.history.forEach(h=>{
      const name = normalizeItemName(h.name);
      const key = itemMatchKey(name);
      if(!seenHistory.has(key)){
        seenHistory.add(key);
        dedupedHistory.push({ name, category: h.category });
      }
    });
    state.history = dedupedHistory;

    return state;
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.categories) && Array.isArray(parsed.items)){
          if(!Array.isArray(parsed.history)) parsed.history = [];
          return normalizeState(parsed);
        }
      }
    }catch(e){ /* fall through to default */ }
    return {
      categories: DEFAULT_CATEGORIES.slice(),
      items: [],
      history: []
    };
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();
  saveState(); // persist any casing/dedup cleanup from normalizeState immediately
  let editingItemId = null;
  const expandedHistory = new Set();

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  // ---------- Rendering ----------

  function renderCategorySelect(){
    const select = document.getElementById('categorySelect');
    const prev = select.value;
    select.innerHTML = '';
    state.categories.forEach(cat=>{
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
    if(state.categories.includes(prev)) select.value = prev;
  }

  function renderCategories(){
    const container = document.getElementById('categoriesContainer');
    container.innerHTML = '';

    state.categories.forEach(cat=>{
      const section = document.createElement('section');
      section.className = 'category';

      const header = document.createElement('div');
      header.className = 'category-header';

      const sign = document.createElement('div');
      sign.className = 'aisle-sign';
      sign.innerHTML = `<span class="grommet"></span>${escapeHtml(cat)}`;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-cat';
      delBtn.title = 'Delete this aisle';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', ()=> armConfirm(delBtn, ()=> deleteCategory(cat), '✓ Sure?'));
      sign.appendChild(delBtn);

      header.appendChild(sign);

      const historyForCat = state.history
        .filter(h => h.category === cat)
        .sort((a, b)=> a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

      if(historyForCat.length === 0){
        expandedHistory.delete(cat);
      }

      const isOpen = expandedHistory.has(cat);

      if(historyForCat.length > 0){
        const toggle = document.createElement('button');
        toggle.className = 'history-toggle' + (isOpen ? ' open' : '');
        toggle.textContent = `${isOpen ? '▴' : '▾'} Last trip (${historyForCat.length})`;
        toggle.addEventListener('click', ()=>{
          if(expandedHistory.has(cat)) expandedHistory.delete(cat);
          else expandedHistory.add(cat);
          renderCategories();
        });
        header.appendChild(toggle);
      }

      section.appendChild(header);

      if(historyForCat.length > 0 && isOpen){
        const panel = document.createElement('div');
        panel.className = 'category-history';

        const panelHead = document.createElement('div');
        panelHead.className = 'category-history-head';

        const panelLabel = document.createElement('span');
        panelLabel.textContent = 'From last trip';

        const clearBtn = document.createElement('button');
        clearBtn.className = 'history-clear';
        clearBtn.textContent = 'clear';
        clearBtn.addEventListener('click', ()=>
          armConfirm(clearBtn, ()=> clearHistoryForCategory(cat), 'Sure?')
        );

        panelHead.appendChild(panelLabel);
        panelHead.appendChild(clearBtn);
        panel.appendChild(panelHead);

        const chipsRow = document.createElement('div');
        chipsRow.className = 'history-chips';

        historyForCat.forEach(h=>{
          const chip = document.createElement('div');
          chip.className = 'history-chip';

          const title = document.createElement('button');
          title.className = 'history-title';
          title.textContent = h.name;
          title.title = `Add back to ${h.category}`;
          title.addEventListener('click', ()=> reAddFromHistory(h));

          const remove = document.createElement('button');
          remove.className = 'history-remove';
          remove.textContent = '×';
          remove.title = 'Remove from this list';
          remove.addEventListener('click', ()=> removeFromHistory(h));

          chip.appendChild(title);
          chip.appendChild(remove);
          chipsRow.appendChild(chip);
        });

        panel.appendChild(chipsRow);
        section.appendChild(panel);
      }

      const itemsInCat = state.items
        .filter(it=>it.category === cat)
        .sort((a, b)=> a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

      if(itemsInCat.length === 0){
        const note = document.createElement('p');
        note.className = 'empty-note';
        note.textContent = 'No items yet — add one above.';
        section.appendChild(note);
      } else {
        const ul = document.createElement('ul');
        ul.className = 'item-list';
        itemsInCat.forEach(item=>{
          const li = document.createElement('li');
          li.className = 'item';
          li.dataset.id = item.id;

          if(item.id === editingItemId){
            li.classList.add('editing');

            const editRow = document.createElement('div');
            editRow.className = 'edit-row';

            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'edit-name';
            nameInput.value = item.name;

            const catSelect = document.createElement('select');
            catSelect.className = 'edit-category';
            state.categories.forEach(c=>{
              const opt = document.createElement('option');
              opt.value = c;
              opt.textContent = c;
              if(c === item.category) opt.selected = true;
              catSelect.appendChild(opt);
            });

            const saveBtn = document.createElement('button');
            saveBtn.type = 'button';
            saveBtn.className = 'edit-save';
            saveBtn.textContent = 'Save';
            saveBtn.addEventListener('click', ()=> saveEdit(item.id, nameInput.value, catSelect.value));

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'edit-cancel';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', cancelEdit);

            nameInput.addEventListener('keydown', (e)=>{
              if(e.key === 'Enter'){ e.preventDefault(); saveBtn.click(); }
              if(e.key === 'Escape'){ e.preventDefault(); cancelBtn.click(); }
            });

            editRow.appendChild(nameInput);
            editRow.appendChild(catSelect);
            editRow.appendChild(saveBtn);
            editRow.appendChild(cancelBtn);
            li.appendChild(editRow);

            ul.appendChild(li);
            // focus after insertion so the cursor lands in the field
            requestAnimationFrame(()=> nameInput.focus());
            return;
          }

          const label = document.createElement('label');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = false;
          checkbox.addEventListener('change', ()=> checkOffItem(item.id));
          const span = document.createElement('span');
          span.textContent = item.name;
          label.appendChild(checkbox);
          label.appendChild(span);

          const actions = document.createElement('div');
          actions.className = 'item-actions';

          const editBtn = document.createElement('button');
          editBtn.className = 'edit-btn';
          editBtn.title = 'Edit item';
          editBtn.textContent = '✎';
          editBtn.addEventListener('click', ()=> startEdit(item.id));

          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove';
          removeBtn.textContent = '×';
          removeBtn.title = 'Remove without saving';
          removeBtn.addEventListener('click', ()=> armConfirm(removeBtn, ()=> removeItem(item.id), '✓ Sure?'));

          actions.appendChild(editBtn);
          actions.appendChild(removeBtn);

          li.appendChild(label);
          li.appendChild(actions);
          ul.appendChild(li);
        });
        section.appendChild(ul);
      }

      container.appendChild(section);
    });
  }

  function renderAll(){
    renderCategorySelect();
    renderCategories();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Mutations ----------

  function flashItem(id){
    const el = document.querySelector(`.item[data-id="${id}"]`);
    if(!el) return;
    el.classList.remove('flash');
    // force reflow so the animation restarts if triggered again quickly
    void el.offsetWidth;
    el.classList.add('flash');
  }

  // A tap-to-arm, tap-again-to-confirm pattern used instead of the native
  // confirm() dialog, which sandboxed preview environments (and some
  // embedded webviews) silently block. First click puts the button into an
  // "armed" state for a few seconds; a second click within that window
  // actually performs the action. Clicking elsewhere, or letting it time
  // out, reverts back to the normal state with nothing removed.
  function armConfirm(button, action, armedLabel){
    if(button.dataset.armed === '1'){
      clearTimeout(button._armTimer);
      delete button.dataset.armed;
      button.classList.remove('armed');
      button.textContent = button.dataset.originalLabel;
      action();
      return;
    }

    button.dataset.armed = '1';
    button.dataset.originalLabel = button.textContent;
    button.classList.add('armed');
    button.textContent = armedLabel;

    button._armTimer = setTimeout(()=>{
      delete button.dataset.armed;
      button.classList.remove('armed');
      button.textContent = button.dataset.originalLabel;
    }, 2500);
  }

  let addStatusTimeout = null;
  function showAddStatus(message, tone){
    const el = document.getElementById('addStatus');
    clearTimeout(addStatusTimeout);
    el.textContent = message;
    el.className = 'add-status visible' + (tone ? ' ' + tone : '');
    addStatusTimeout = setTimeout(()=>{
      el.classList.remove('visible');
    }, 2600);
  }

  function addItem(name, category){
    name = normalizeItemName(name);
    if(!name) return;
    const key = itemMatchKey(name);

    const activeMatch = state.items.find(
      it => itemMatchKey(it.name) === key
    );
    if(activeMatch){
      flashItem(activeMatch.id);
      showAddStatus(`${activeMatch.name} is already in ${activeMatch.category}.`, 'duplicate');
      return;
    }

    const historyMatch = state.history.find(
      h => itemMatchKey(h.name) === key
    );
    if(historyMatch){
      reAddFromHistory(historyMatch);
      showAddStatus(`Added ${historyMatch.name} back from last trip (${historyMatch.category}).`, 'moved');
      return;
    }

    state.items.push({ id: uid(), name, category });
    saveState();
    renderCategories();
    showAddStatus(`Added ${name} to ${category}.`);
  }

  function removeItem(id){
    const item = state.items.find(it=>it.id === id);
    if(!item) return;
    state.items = state.items.filter(it=>it.id !== id);
    saveState();
    renderCategories();
  }

  function startEdit(id){
    editingItemId = id;
    renderCategories();
  }

  function cancelEdit(){
    editingItemId = null;
    renderCategories();
  }

  function saveEdit(id, newName, newCategory){
    const item = state.items.find(it=>it.id === id);
    if(!item) return;

    const name = normalizeItemName(newName) || item.name;
    let category = (newCategory && state.categories.includes(newCategory)) ? newCategory : item.category;
    const key = itemMatchKey(name);

    const activeMatch = state.items.find(
      it => it.id !== id && itemMatchKey(it.name) === key
    );
    if(activeMatch){
      editingItemId = null;
      renderCategories();
      flashItem(activeMatch.id);
      showAddStatus(`${activeMatch.name} is already in ${activeMatch.category}.`, 'duplicate');
      return;
    }

    const historyMatch = state.history.find(
      h => itemMatchKey(h.name) === key
    );
    if(historyMatch){
      category = historyMatch.category;
      state.history = state.history.filter(
        h => itemMatchKey(h.name) !== key
      );
      showAddStatus(`Cleared ${historyMatch.name} from last trip — moved to ${category}.`, 'moved');
    }

    item.name = name;
    item.category = category;

    editingItemId = null;
    saveState();
    renderAll();
  }

  function checkOffItem(id){
    const item = state.items.find(it=>it.id === id);
    if(!item) return;

    state.items = state.items.filter(it=>it.id !== id);

    const alreadyInHistory = state.history.some(
      h=> itemMatchKey(h.name) === itemMatchKey(item.name)
    );
    if(!alreadyInHistory){
      state.history.unshift({ name: item.name, category: item.category });
    }
    saveState();
    renderCategories();
  }

  function reAddFromHistory(h){
    if(!state.categories.includes(h.category)){
      state.categories.push(h.category);
    }
    const key = itemMatchKey(h.name);
    const alreadyActive = state.items.some(
      it=> itemMatchKey(it.name) === key
    );
    if(!alreadyActive){
      state.items.push({ id: uid(), name: h.name, category: h.category });
    }
    state.history = state.history.filter(
      item => itemMatchKey(item.name) !== key
    );
    saveState();
    renderAll();
  }

  function addCategory(name){
    name = name.trim();
    if(!name) return;
    const exists = state.categories.some(c=>c.toLowerCase() === name.toLowerCase());
    if(exists) return;
    state.categories.push(name);
    saveState();
    renderAll();
  }

  function deleteCategory(cat){
    state.categories = state.categories.filter(c=>c !== cat);
    state.items = state.items.filter(it=>it.category !== cat);
    saveState();
    renderAll();
  }

  function clearHistoryForCategory(cat){
    state.history = state.history.filter(h => h.category !== cat);
    saveState();
    renderCategories();
  }

  function removeFromHistory(h){
    state.history = state.history.filter(
      item => itemMatchKey(item.name) !== itemMatchKey(h.name)
    );
    saveState();
    renderCategories();
  }

  // ---------- Events ----------

  function submitNewItem(){
    const input = document.getElementById('itemInput');
    const select = document.getElementById('categorySelect');
    if(!input.value.trim()) return;
    addItem(input.value, select.value);
    input.value = '';
    input.focus();
  }

  document.getElementById('addItemBtn').addEventListener('click', submitNewItem);

  document.getElementById('itemInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      submitNewItem();
    }
  });

  document.getElementById('toggleCategoryForm').addEventListener('click', function(){
    document.getElementById('newCategoryForm').classList.toggle('hidden');
    document.getElementById('newCategoryInput').focus();
  });

  document.getElementById('cancelNewCategory').addEventListener('click', function(){
    document.getElementById('newCategoryForm').classList.add('hidden');
    document.getElementById('newCategoryInput').value = '';
  });

  document.getElementById('confirmNewCategory').addEventListener('click', function(){
    const input = document.getElementById('newCategoryInput');
    addCategory(input.value);
    input.value = '';
    document.getElementById('newCategoryForm').classList.add('hidden');
  });

  document.getElementById('newCategoryInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      document.getElementById('confirmNewCategory').click();
    }
  });

  renderAll();
})();
</script>
</body>
</html>
